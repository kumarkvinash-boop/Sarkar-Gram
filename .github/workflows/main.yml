name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # यहाँ हम GitHub को बता रहे हैं कि लेटेस्ट Node.js इस्तेमाल करे ताकि एरर न आए
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # यह कमांड अपने आप सारी सेटिंग्स सही कर देगा
          buildozer android debug || true
          # अगर पहली बार में फेल हो तो दोबारा कोशिश करने के लिए
          buildozer android debug
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sarkar-Gram-App
          path: bin/*.apk
